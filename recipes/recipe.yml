---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: kyteos
description: KyteOS - Custom KDE Plasma experience with gaming, emulation, and productivity tools.
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: "44"

modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
        - atim/lutris
        - atim/mangohud
    install:
      packages:
        # --- Core System & Windows Emulation Base ---
        - waydroid         # Android subsystem
        - wine             # Base Windows compatibility layer
        - wine-core
        - gamemode         # Optimizes system for gaming
        - mangohud         # FPS/Performance overlay
        - podman           # Container engine (required for Distrobox)
        - distrobox        # Mutable environments
        
        # --- System Management & Monitoring ---
        - btop             # Resource monitor
        - fastfetch        # System info
        - micro            # Terminal text editor
        - starship         # Shell prompt

        # --- Qt6 dependencies for SilentSDDM ---
        - qt6-qtsvg
        - qt6-qtvirtualkeyboard
        - qt6-qtmultimedia
        - qt6-qtimageformats
        
        # --- Fonts ---
        - papirus-icon-theme
        - capitaine-cursors
    remove:
      packages:
        # --- Removing Firefox RPM in favor of Flatpak ---
        - firefox
        - firefox-langpacks
        # --- Removing KDE Discover in favor of Bazaar ---
        - plasma-discover
        - plasma-discover-flatpak
        - plasma-discover-rpm-ostree
        - plasma-discover-packagekit

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # --- Browsers & Communication ---
          - org.mozilla.firefox
          - io.github.vencord.Vesktop  # Discord alternative
          - org.telegram.desktop

          # --- App Store & Windows Emulation ---
          - io.github.kolunmi.Bazaar   # Replaces Discover
          - com.usebottles.bottles     # The best Windows app runner for Linux
          - net.davidotek.pupgui2      # ProtonUp-Qt (manage Proton-GE for Steam)
          - com.github.Matoking.protontricks

          # --- Gaming Launchers ---
          - com.valvesoftware.Steam
          - com.heroicgameslauncher.hgl
          - net.lutris.Lutris

          # --- Emulation ---
          - org.libretro.RetroArch
          - org.DolphinEmu.dolphin-emu
          - io.github.shiiion.primehack # Metroid Prime Dolphin fork
          - org.pcsx2.PCSX2            # PS2
          - net.rpcs3.RPCS3            # PS3
          - org.ppsspp.PPSSPP          # PSP
          - org.duckstation.DuckStation # PS1
          - org.xemu.xemu              # Original Xbox
          - org.sudachi_emu.sudachi    # Switch

          # --- Productivity & Office ---
          - org.onlyoffice.desktopeditors

          # --- Media & Entertainment ---
          - io.github.diegopvlk.Cine   # Clean MPV-based video player
          - xyz.nokarin.aqloss         # Rust audio player (bit-perfect)
          - de.haeckerfelix.Shortwave  # Internet Radio
          - com.transmissionbt.Transmission # Torrents

          # --- Creativity ---
          - org.kde.krita              # Professional paint app

          # --- System Management, Security & Utilities ---
          - com.github.tchx84.Flatseal # Flatpak permissions management
          - org.gufw.Gufw              # Firewall configuration
          - io.github.flattool.Warehouse # Flatpak manager/backup
          - com.ranfdev.DistroShelf    # Distrobox GUI manager
          - it.mijorus.gearlever       # AppImage manager
          
      - scope: user # Also add Flathub user repo, but no user packages

  - type: script
    scripts:
      - scripts/install-silentsddm.sh

  - type: signing